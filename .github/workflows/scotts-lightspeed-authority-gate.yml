name: Lightspeed storefront authority gate
on:
  push:
    branches: [feature/scotts-storefront-lightspeed-authority]
  pull_request:
    paths:
      - 'supabase/functions/_shared/lightspeed-storefront/**'
      - 'supabase/functions/lightspeed-storefront-bridge/**'
      - 'supabase/migrations/*lightspeed_storefront_authority.sql'
      - 'src/pages/integrations/lightspeed/CallbackPage.tsx'
      - 'tests/lightspeed-storefront-authority.sql'
      - '.github/workflows/scotts-lightspeed-authority-gate.yml'
permissions:
  contents: read
jobs:
  sql-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: {PGPASSWORD: postgres}
    steps:
      - uses: actions/checkout@v4
      - name: Apply private schema and test CAS, replay and RLS
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role LOGIN BYPASSRLS;"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261009161000_lightspeed_storefront_authority.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/lightspeed-storefront-authority.sql
  deno-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - name: Type-check isolated authority endpoint
        run: deno check --node-modules-dir=auto supabase/functions/lightspeed-storefront-bridge/index.ts
