name: Support activity evidence
on:
  pull_request:
    paths: ['supabase/functions/send-support-emails/**', 'supabase/migrations/*support_activity*', 'tests/support-activity/**', '.github/workflows/support-activity.yml']
  push:
    branches: [main]
    paths: ['supabase/functions/send-support-emails/**', 'supabase/migrations/*support_activity*', 'tests/support-activity/**', '.github/workflows/support-activity.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_HOST_AUTH_METHOD: trust}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node --test tests/support-activity/*.test.mjs
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - run: deno check --no-config supabase/functions/send-support-emails/index.ts
      - name: Native snapshot and concurrency checks
        env: {PGHOST: localhost, PGPORT: '5432', PGUSER: postgres}
        run: |
          createdb support_activity_test
          psql -v ON_ERROR_STOP=1 -d support_activity_test -f tests/support-activity/state.sql
