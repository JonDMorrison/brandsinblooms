# The existing required `expect` context is retained. For the explicitly
# approved, catalogued Bloom attachment repair it verifies a frozen browser
# reproduction, not an AI report or candidate-supplied test. Other PRs retain
# the previously disabled/skipped behavior; they never receive a false green.
name: Expect CI

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  expect:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'bloom/fix-')
    runs-on: ubuntu-latest
    timeout-minutes: 17
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Check out frozen trusted base only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test trusted observer and gate
        run: node --test .github/scripts/bloom-expect-gate.test.mjs .github/scripts/bloom-public-attachment*.test.mjs .github/scripts/bloom-trusted-reproduction.test.mjs

      - name: Require exact frozen red-to-green browser proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/bloom-expect-gate.mjs
