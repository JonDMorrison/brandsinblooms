name: Publish reviewed Intelligence redesign
on:
  push:
    branches: [feature/intelligence-experience-20261015]
    paths: [.github/workflows/publish-intelligence-reviewed.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply reviewed, checksum-pinned source and preserve all unrelated features
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5fb16faa0e7de47ab62c07c3d67bb5735b0ade38"
          curl --fail --silent --show-error --retry 2 "https://sb-387hw3e9aar3.vercel.run/reviewed-intelligence.patch" -o /tmp/reviewed-intelligence.patch
          echo "9196da469223aedf3f7408ebdcc1fb7c60791b8dceb9aa67dfa3e83f7dd4d8df  /tmp/reviewed-intelligence.patch" | sha256sum --check --strict
          git apply --check /tmp/reviewed-intelligence.patch
          git apply --index /tmp/reviewed-intelligence.patch
          git rm .github/workflows/publish-intelligence-reviewed.yml
          test "$(git write-tree)" = "b4155c26d79239f7abd66c11fc2fc96278c9a3b8"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: guide Intelligence by customer goals with contextual Bloom"
          git push origin HEAD:refs/heads/feature/intelligence-experience-20261015
