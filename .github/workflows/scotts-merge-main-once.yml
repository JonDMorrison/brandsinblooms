name: Reconcile Scott's Lightspeed branch with main (one-time)
on:
  push:
    branches:
      - feature/scotts-lightspeed-stripe-paid-sale-contract-20261112
    paths:
      - .github/workflows/scotts-merge-main-once.yml
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Merge latest main without dropping existing changes
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin main
          git merge --no-commit --no-ff -X ours origin/main
          deno install --frozen=false
          deno check --node-modules-dir=auto --frozen=true supabase/functions/lightspeed-storefront-bridge/index.ts
          git add -A
          git commit -m "Merge current main into Scott's Lightspeed and verify Deno lock"
          git push origin HEAD:feature/scotts-lightspeed-stripe-paid-sale-contract-20261112
