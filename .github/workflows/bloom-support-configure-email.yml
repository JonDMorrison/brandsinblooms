name: Configure Bloom Support email
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bloom-support-configure-email.yml'
      - 'scripts/bloom-support/configure-email.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bloom-support-configure-email
  cancel-in-progress: false
jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure the dedicated webhook and verify its signature
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/bloom-support/configure-email.mjs
