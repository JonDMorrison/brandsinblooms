name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Playwright project to run"
        required: false
        default: "chromium"
        type: choice
        options:
          - chromium
          - setup
  push:
    branches:
      - qa/crm-release-clickthrough

jobs:
  test:
    timeout-minutes: 25
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps

    - name: Run production CRM release click-through
      if: github.event_name == 'push'
      run: npx playwright test e2e/release/crm-release-clickthrough.spec.ts --config=playwright.prod.config.ts --project=chromium
      env:
        E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
        E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

    - name: Run requested E2E tests against production
      if: github.event_name == 'workflow_dispatch'
      run: npx playwright test --config=playwright.prod.config.ts --project=${{ inputs.project }}
      env:
        E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
        E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results
        path: test-results/
        retention-days: 7
