name: Reviewed spending source audit
on:
  push:
    branches: [fix/west-coast-intelligence-workflow]
    paths:
      - .github/workflows/intelligence-recovery-audit.yml
permissions:
  contents: read
concurrency:
  group: intelligence-spending-recovery-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned original XLS decoder
        run: python -m pip install --disable-pip-version-check xlrd==2.0.2
      - name: Verify script syntax and source parser regressions
        run: |
          node --check scripts/audit-spending-recovery.mjs
          node --test scripts/tests/ideal-category-sales.test.mjs
      - name: Audit queued private source jobs without publishing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          EXPECTED_PROJECT_ID: udldmkqwnxhdeztyqcau
          IDEAL_SYNC_PYTHON: python
        run: node scripts/audit-spending-recovery.mjs
