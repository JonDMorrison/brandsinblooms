name: BloomSuite Pre-Beta QA

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  prebeta-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    env:
      ENVIRONMENT: staging
      VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
      TEST_ADMIN_EMAIL: ${{ secrets.STAGING_TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.STAGING_TEST_ADMIN_PASSWORD }}
      TEST_EDITOR_EMAIL: ${{ secrets.STAGING_TEST_EDITOR_EMAIL }}
      TEST_EDITOR_PASSWORD: ${{ secrets.STAGING_TEST_EDITOR_PASSWORD }}
      TEST_VIEWER_EMAIL: ${{ secrets.STAGING_TEST_VIEWER_EMAIL }}
      TEST_VIEWER_PASSWORD: ${{ secrets.STAGING_TEST_VIEWER_PASSWORD }}
    steps:
    - name: Verify staging QA prerequisites
      shell: bash
      run: |
        missing=0
        for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY TEST_ADMIN_EMAIL TEST_ADMIN_PASSWORD TEST_EDITOR_EMAIL TEST_EDITOR_PASSWORD TEST_VIEWER_EMAIL TEST_VIEWER_PASSWORD; do
          if [[ -z "${!name}" ]]; then
            echo "::error::Missing staging QA configuration: $name. Configure the corresponding STAGING secret; never substitute production credentials."
            missing=1
          fi
        done
        exit "$missing"
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright
      run: npx playwright install --with-deps
      
    - name: Run Pre-Beta E2E Tests
      run: npm run test:e2e:prebeta
        
    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qa-prebeta-report
        path: |
          e2e/artifacts/
          e2e/reports/
        retention-days: 30
