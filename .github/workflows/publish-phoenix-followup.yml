name: Publish reviewed Operation Phoenix line integrity
on:
  push:
    branches: [feature/phoenix-readiness-20261015]
    paths: [.github/workflows/publish-phoenix-followup.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply the verified supplemental Ideal line guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2a0c4170feb164a5da086e6785364b19aefec525"
          curl --fail --silent --show-error --retry 2 "https://sb-387hw3e9aar3.vercel.run/phoenix-followup.patch" -o /tmp/phoenix-followup.patch
          echo "be8feeca927a783523f535823769b1f1d0f5fd4afb01eb6ba40d6c0a10481173  /tmp/phoenix-followup.patch" | sha256sum --check --strict
          git apply --check /tmp/phoenix-followup.patch
          git apply --index /tmp/phoenix-followup.patch
          git rm .github/workflows/publish-phoenix-followup.yml
          test "$(git write-tree)" = "15f1a2170307032ee4482fad5921f82d3dde08c4"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: enforce exact Ideal transaction-line identities"
          git push origin HEAD:refs/heads/feature/phoenix-readiness-20261015
