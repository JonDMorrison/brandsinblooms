name: Publish verified Intelligence handoff refinement
on:
  push:
    branches: [feature/intelligence-bloom-handoff-finish]
    paths: [.github/workflows/publish-intelligence-refinement.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply and verify exactly the tested Intelligence changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8866237fd73e642cd8f6ae39fb21e64351af66f9"
          curl --fail --silent --show-error --retry 2 "https://sb-387hw3e9aar3.vercel.run/intelligence-followup.patch" -o /tmp/intelligence-followup.patch
          echo "3cb2d9b1daf3e39d3c88ee27c8aad95960434b835f669d6e0446ea9d32bc3971  /tmp/intelligence-followup.patch" | sha256sum --check --strict
          git apply --check /tmp/intelligence-followup.patch
          git apply --index /tmp/intelligence-followup.patch
          git rm .github/workflows/publish-intelligence-refinement.yml
          test "$(git write-tree)" = "2d4263f117b545b3b0a3b9c9bd192f7dd587617c"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: return to Intelligence Rewards from Bloom and guard unselected companies'
          git push origin HEAD:refs/heads/feature/intelligence-bloom-handoff-finish
