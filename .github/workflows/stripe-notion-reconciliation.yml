name: Stripe Notion reconciliation tests
on:
  pull_request:
    paths: ['supabase/functions/reconcile-stripe-notion/**', 'tests/reconciliation/**', '.github/workflows/stripe-notion-reconciliation.yml']
  push:
    branches: [main]
    paths: ['supabase/functions/reconcile-stripe-notion/**', 'tests/reconciliation/**', '.github/workflows/stripe-notion-reconciliation.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/reconciliation/*.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - run: deno check --no-config supabase/functions/reconcile-stripe-notion/index.ts
