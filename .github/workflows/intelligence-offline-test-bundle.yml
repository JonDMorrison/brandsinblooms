name: Intelligence offline test bundle
on:
  push:
    branches: [fix/west-coast-intelligence-workflow]
    paths: [.github/workflows/intelligence-offline-test-bundle.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tracked source without credentials or dependencies
        run: |
          set -euo pipefail
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/intelligence-source.tar.gz"
          ls -lh "$RUNNER_TEMP/intelligence-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: intelligence-source-only
          path: ${{ runner.temp }}/intelligence-source.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
