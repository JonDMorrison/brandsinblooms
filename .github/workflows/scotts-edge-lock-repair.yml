name: Repair frozen edge dependency graph (one-time)
on:
  push:
    branches:
      - feature/scotts-lightspeed-stripe-paid-sale-contract-20261112
    paths:
      - .github/workflows/scotts-edge-lock-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Regenerate all edge function dependencies once
        run: |
          deno install --config supabase/functions/deno.json --frozen=false
          count=0
          for dir in supabase/functions/*/; do
            fn="$(basename "$dir")"
            [[ "$fn" == _* ]] && continue
            [[ -f "$dir/index.ts" ]] || continue
            deno info --config supabase/functions/deno.json --frozen=false \
              --allow-import=cdn.sheetjs.com,deno.land,esm.sh,jsr.io,registry.npmjs.org \
              "$dir/index.ts" >/dev/null
            count=$((count + 1))
          done
          echo "Refreshed dependency graphs for $count functions"
      - name: Verify frozen lock against actual Lightspeed authority
        run: |
          deno check --node-modules-dir=auto --frozen=true supabase/functions/lightspeed-storefront-bridge/index.ts
          deno info --config supabase/functions/deno.json --frozen-lockfile \
            --allow-import=cdn.sheetjs.com,deno.land,esm.sh,jsr.io,registry.npmjs.org \
            supabase/functions/bloom-support-slack/index.ts >/dev/null
      - name: Commit verified lockfile
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add supabase/functions/deno.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(deno): reconcile all edge dependency graphs in frozen lock"
            git push origin HEAD:feature/scotts-lightspeed-stripe-paid-sale-contract-20261112
          fi
