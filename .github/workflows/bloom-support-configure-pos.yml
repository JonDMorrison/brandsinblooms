name: Configure Bloom Support POS connection
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bloom-support-configure-pos.yml'
      - 'scripts/bloom-support/configure-pos.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bloom-support-configure-pos
  cancel-in-progress: false
jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure the two fixed production projects and verify signed POS authentication
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/bloom-support/configure-pos.mjs
