# Temporary branch-only transport. Removed before merge; checksums fix exact code.
name: Publish reviewed reporting fix
on:
  push:
    branches: [fix/crm-reporting-timeouts]
    paths: [.github/workflows/publish-reviewed-reporting-fix.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'JonDMorrison/brandsinblooms' && github.ref == 'refs/heads/fix/crm-reporting-timeouts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/crm-reporting-timeouts
          fetch-depth: 2
      - name: Apply verified patch only to the expected parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '02e3d2609102996a35e32ff871378ce9d4cf71cf'
          curl --fail --silent --show-error --retry 2 'https://sb-387hw3e9aar3.vercel.run/reporting.patch' -o /tmp/reporting.patch
          echo '4cd1ef373a50e46929b5af77b89987b215c54ac4de77a09e7e4708db7f37913c  /tmp/reporting.patch' | sha256sum --check --strict
          git apply --check /tmp/reporting.patch
          git apply --index /tmp/reporting.patch
          git rm --cached .github/workflows/publish-reviewed-reporting-fix.yml
          test "$(git write-tree)" = '9eefa3b7be4bcc520f8fc58b29d811f69d912cb4'
          git add .github/workflows/publish-reviewed-reporting-fix.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: scope reporting reads and avoid repeated membership lookups'
          git push origin HEAD:refs/heads/fix/crm-reporting-timeouts
