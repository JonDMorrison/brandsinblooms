name: Deploy reviewed Phoenix Ideal line schema
on:
  push:
    branches: [chore/phoenix-ideal-schema-rollout]
    paths: [.github/workflows/deploy-phoenix-ideal-schema.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6a23167ebb8bfcc7902eb53bcf55347736bad5d4
          persist-credentials: false
      - name: Atomically apply the exact reviewed migration before Edge rollout
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,urllib.request,urllib.error
          from pathlib import Path
          token=os.environ.get('SUPABASE_ACCESS_TOKEN','')
          if not token: raise SystemExit('Existing deployment credential unavailable; no schema changed.')
          source=Path('supabase/migrations/20261015220149_ideal_line_identity_guard.sql').read_text()
          expected='d412b73b3ab7c2ad92ad99f30d75393b87aa7de6bd06025cdeb4e7214c1e82c2'
          if hashlib.sha256(source.encode()).hexdigest()!=expected:
            raise SystemExit('Reviewed source hash mismatch. No schema changed.')
          endpoint='https://api.supabase.com/v1/projects/udldmkqwnxhdeztyqcau/database/query'
          def query(sql,read_only=False):
            req=urllib.request.Request(endpoint,
              data=json.dumps({'query':sql,'read_only':read_only}).encode(),
              headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=180) as response: return json.load(response)
            except urllib.error.HTTPError as error:
              msg=error.read().decode(errors='replace').replace(token,'[REDACTED]')
              print('Database operation failed:',error.code,msg[:2500])
              raise SystemExit(1)
          state=query("""
            select count(*) filter(where source='ideal')::integer as ideal_rows,
              (select count(*) from pg_constraint where conname='ideal_line_requires_source_keys'
                and conrelid='public.customer_purchase_line_items'::regclass and convalidated) as checked_constraints,
              (select count(*) from pg_indexes where schemaname='public'
                and tablename='customer_purchase_line_items'
                and indexname='customer_ideal_unique_source_line') as unique_indexes,
              (select count(*) from supabase_migrations.schema_migrations where version='20261015220149') as migration_rows
            from public.customer_purchase_line_items
          """,True)[0]
          installed=(state['checked_constraints'],state['unique_indexes'],state['migration_rows'])
          if any(installed):
            if installed==(1,1,1):
              print('Already installed and verified as the exact intended schema.')
              raise SystemExit(0)
            raise SystemExit('Schema/migration-history mismatch: requires manual reconciliation; no changes made.')
          if state['ideal_rows']!=0:
            raise SystemExit('Found existing Ideal purchases; stop and reconcile before adding the guard.')
          prefix="BEGIN; SET LOCAL lock_timeout='5s'; SET LOCAL statement_timeout='120s';"
          query(prefix+source+' ROLLBACK;')
          print('Dry run passed; original customer records remain unchanged.')
          delim='$idealguard_d412b73b$'
          if delim in source: raise SystemExit('SQL delimiter collision.')
          history=("INSERT INTO supabase_migrations.schema_migrations(version,name,statements) "
             "VALUES('20261015220149','ideal_line_identity_guard',ARRAY["+delim+source+delim+"]::text[]);")
          query(prefix+source+history+' COMMIT;')
          status=query("""
            select
              (select count(*) from pg_constraint where conname='ideal_line_requires_source_keys'
               and conrelid='public.customer_purchase_line_items'::regclass and convalidated) as guard,
              (select count(*) from pg_index where indexrelid='public.customer_ideal_unique_source_line'::regclass
               and indisunique and indisvalid) as unique_source,
              (select count(*) from supabase_migrations.schema_migrations where version='20261015220149') as recorded,
              (select count(*) from public.customer_purchase_line_items where source='ideal') as ideal_rows
          """,True)[0]
          if (status['guard'],status['unique_source'],status['recorded'],status['ideal_rows'])!=(1,1,1,0):
            raise SystemExit('Post-deployment verification failed. Review the recorded change before any imports.')
          print('PASS: exact migration installed, transaction-line guard validated, unique source index and history verified, no Ideal customer data modified.')
          PY
