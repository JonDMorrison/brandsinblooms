name: Temporary release audit source
on:
  push:
    branches: [chore/release-audit-source-20261009]
    paths: [.github/workflows/temporary-release-audit-source.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Archive tracked source without environment or key files
        run: |
          mkdir -p audit-artifact
          git rev-parse HEAD > audit-artifact/source-commit.txt
          git archive --format=tar.gz --output=audit-artifact/crm-source.tar.gz HEAD -- . ':!.env*' ':!**/.env*' ':!**/*.pem' ':!**/*.key' ':!**/*.p12' ':!**/*credentials*.json'
      - uses: actions/upload-artifact@v4
        with:
          name: pos-release-crm-source
          path: audit-artifact/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
