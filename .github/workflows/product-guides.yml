name: Product feature libraries
on:
  pull_request:
    paths:
      - 'content/product-libraries/**'
      - 'content/product-guide-topics.json'
      - 'public/product-guides/**'
      - 'scripts/write-product-guides.mjs'
      - 'scripts/product-guides/**'
      - 'src/components/suite/ProductFeatureFinderLinks.tsx'
      - 'src/components/suite/productGuideContext*'
      - 'src/components/landing/LandingPageHeader.tsx'
      - 'src/pages/ContactPage.tsx'
      - 'src/pages/FeaturesPage.tsx'
      - 'src/pages/public/EcommPage.tsx'
      - 'api/product-guide-not-found.ts'
      - 'vercel.json'
      - 'package.json'
      - '.github/workflows/product-guides.yml'
permissions:
  contents: read
concurrency:
  group: product-guides-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:product-guides
      - run: npx vitest run src/components/suite/productGuideContext.test.ts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/product-guides/browser.mjs
