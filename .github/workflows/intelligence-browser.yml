name: Intelligence Journey Browser
on:
  pull_request:
    paths:
      - "src/pages/crm/CustomerIntelligencePage.tsx"
      - "src/pages/BloomPage.tsx"
      - "src/components/crm/customer-intelligence/CustomerGrowthWorkspace.tsx"
      - "src/lib/customer-intelligence/**"
      - "e2e/intelligence/**"
      - "playwright.intelligence.config.ts"
      - "vite.intelligence-preview.config.ts"
      - ".github/workflows/intelligence-browser.yml"
  push:
    branches: [main]
    paths:
      - "src/pages/crm/CustomerIntelligencePage.tsx"
      - "src/pages/BloomPage.tsx"
      - "src/components/crm/customer-intelligence/CustomerGrowthWorkspace.tsx"
      - "src/lib/customer-intelligence/**"
      - "e2e/intelligence/**"
      - "playwright.intelligence.config.ts"
      - "vite.intelligence-preview.config.ts"
      - ".github/workflows/intelligence-browser.yml"
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test --config playwright.intelligence.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-intelligence-browser
          path: |
            playwright-report-intelligence/
            test-results/intelligence-overview-*.png
          retention-days: 7
