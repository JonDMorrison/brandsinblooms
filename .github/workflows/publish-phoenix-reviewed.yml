name: Publish reviewed Operation Phoenix source
on:
  push:
    branches: [feature/phoenix-readiness-20261015]
    paths: [.github/workflows/publish-phoenix-reviewed.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exactly the source tested against the current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0ab555b83fb85360d39eeac55d0139c448ef87c2"
          curl --fail --silent --show-error --retry 2 "https://sb-387hw3e9aar3.vercel.run/phoenix-reviewed.patch" -o /tmp/phoenix-reviewed.patch
          echo "cef6daa7d49a361f84e5799fb397d2d87f8b37fc9c3c97e67dea82f42868cc30  /tmp/phoenix-reviewed.patch" | sha256sum --check --strict
          git apply --check /tmp/phoenix-reviewed.patch
          git apply --index /tmp/phoenix-reviewed.patch
          git rm .github/workflows/publish-phoenix-reviewed.yml
          test "$(git write-tree)" = "9302dde4a317b7e9c6d71d27e96b231955606f81"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: review Ideal Crystal reports before writing and compare same-date MTD"
          git push origin HEAD:refs/heads/feature/phoenix-readiness-20261015
