# Temporary branch-only transport for the reviewed/tested public-code patch.
# Removed before the pull request is merged. Checksums pin both patch and final tree.
name: Publish reviewed Bloom analysis
on:
  push:
    branches: [feature/bloom-transparent-exploration]
    paths: [.github/workflows/publish-reviewed-bloom-analysis.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'JonDMorrison/brandsinblooms' && github.ref == 'refs/heads/feature/bloom-transparent-exploration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bloom-transparent-exploration
          fetch-depth: 2
      - name: Apply only the verified patch to the expected parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'c6cfb3fb60d9ee04c3f2ae1d93b269e2b45e3c92'
          curl --fail --silent --show-error --retry 2 'https://sb-387hw3e9aar3.vercel.run/reviewed.patch' -o /tmp/reviewed.patch
          echo '85d3f385497371d3c52ee12343d2701bc8fecde02b60288ec7eecfe15c200ef8  /tmp/reviewed.patch' | sha256sum --check --strict
          git apply --check /tmp/reviewed.patch
          git apply --index /tmp/reviewed.patch
          git rm --cached .github/workflows/publish-reviewed-bloom-analysis.yml
          test "$(git write-tree)" = 'b94d432847e2e90b3b9c5bf94c97f639c9faff9d'
          git add .github/workflows/publish-reviewed-bloom-analysis.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: finish transparent Bloom exploration with precision and database tests'
          git push origin HEAD:refs/heads/feature/bloom-transparent-exploration
