name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      # src/ modules (email HTML generator, design system, POS adapters) are
      # bundled into functions, so a change there must redeploy them too.
      - "src/lib/studio/**"
      - "src/lib/crm/htmlContent*.ts"
      - "src/types/**"
      - "src/config/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-edge-functions.yml"
      - "scripts/find-affected-edge-functions.mjs"
      - "src/components/crm/pos/adapters/**"
      - "src/hooks/useCompanyInfo.ts"
      - "src/integrations/supabase/types.ts"

# A failed deploy must never pass silently: the job opens a tracking issue.
permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed functions
        id: changed
        run: |
          changed_paths="$(git diff --name-only HEAD~1 HEAD | grep -v '^supabase/config.toml$' || true)"
          config_function_paths=""
          if ! git diff --quiet HEAD~1 HEAD -- supabase/config.toml; then
            config_function_paths="$(python3 - <<'PY'
          import subprocess
          import tomllib

          old = tomllib.loads(subprocess.check_output(
              ["git", "show", "HEAD~1:supabase/config.toml"], text=True
          ))
          with open("supabase/config.toml", "rb") as source:
              new = tomllib.load(source)

          old_functions = old.get("functions", {})
          new_functions = new.get("functions", {})
          for name in sorted(set(old_functions) | set(new_functions)):
              if old_functions.get(name) != new_functions.get(name):
                  print(f"supabase/functions/{name}/.gateway-config")
          PY
          )"
          fi
          printf '%s\n%s\n' "$changed_paths" "$config_function_paths" \
            | node scripts/find-affected-edge-functions.mjs \
            >> "$GITHUB_OUTPUT"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          tomllib.loads(Path("supabase/config.toml").read_text())
          PY

      - name: Deploy changed functions
        id: deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          functions="${{ steps.changed.outputs.functions }}"
          deploy_all="${{ steps.changed.outputs.deploy_all }}"
          succeeded=0
          failed=0
          failed_names=""

          # Runtime or gateway configuration is broad enough to require
          # a fleet deploy. Shared modules and src imports are resolved through
          # the dependency graph in the detection step.
          if [[ "$deploy_all" == "true" ]]; then
            echo "Runtime configuration changed — deploying all functions..."
            functions=""
            for dir in supabase/functions/*/; do
              fn="$(basename "$dir")"
              [[ "$fn" == _* ]] && continue
              [[ -f "$dir/index.ts" ]] || continue
              functions="$functions $fn"
            done
          elif [[ -z "$functions" ]]; then
            echo "No Edge Function dependencies changed. Nothing to deploy."
          fi

          total=$(echo "$functions" | wc -w | tr -d ' ')
          count=0

          for fn in $functions; do
            count=$((count + 1))
            echo "[$count/$total] Deploying $fn..."

            # Respect each function's verify_jwt declaration in
            # supabase/config.toml. A global --no-verify-jwt here silently
            # disabled the gateway on functions explicitly configured true.
            if supabase functions deploy "$fn" --project-ref "$PROJECT_ID"; then
              echo "  ✓ $fn deployed"
              succeeded=$((succeeded + 1))
            else
              echo "  ✗ $fn FAILED"
              echo "::error title=Edge function deploy failed::$fn was not deployed"
              failed=$((failed + 1))
              failed_names="$failed_names $fn"
            fi
          done

          echo ""
          echo "=== Deployment Summary ==="
          echo "  Total:     $total"
          echo "  Succeeded: $succeeded"
          echo "  Failed:    $failed"

          {
            echo "## Edge function deploy"
            echo ""
            echo "| Result | Count |"
            echo "| --- | --- |"
            echo "| Succeeded | $succeeded |"
            echo "| Failed | $failed |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "failed_names=$(echo "$failed_names" | xargs || true)" >> "$GITHUB_OUTPUT"

          if [[ $failed -gt 0 ]]; then
            echo "  Failed: $failed_names"
            {
              echo ""
              echo "**Not deployed:**$failed_names"
              echo ""
              echo "These functions are still running their previous version"
              echo "in production. Merged changes to them are NOT live."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # A red check on a post-merge workflow is easy to miss — the change is
      # already merged and nobody is watching the run. Open an issue so an
      # undeployed function is impossible to overlook.
      - name: Open tracking issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const failed = '${{ steps.deploy.outputs.failed_names }}'.trim();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Edge function deploy failed — functions are stale in production';
            const body = [
              failed
                ? `The following functions failed to deploy and are still running their previous version in production:\n\n${failed.split(/\s+/).map((f) => `- \`${f}\``).join('\n')}`
                : 'The edge function deploy workflow failed before reporting which functions were affected.',
              '',
              `Commit: ${context.sha}`,
              `Run: ${runUrl}`,
              '',
              'Merged changes to these functions are NOT live until this is fixed and the deploy re-run.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'edge-deploy-failure',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['edge-deploy-failure'],
              });
            }
